[build-system]
requires = ["setuptools>=61,<76"]
build-backend = "setuptools.build_meta"

[project]
name = "dna-sequence-analysis"
version = "0.1.0"
description = "A Python toolkit for DNA sequence quality control and FASTA analysis"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[tool.setuptools]
py-modules = ["dna_analysis", "fasta_parser", "fasta_analysis", "fasta_cli"]
package-dir = {"" = "src"}

[project.scripts]
fasta-qc = "fasta_cli:main"
