[build-system]
requires = ["setuptools>=61,<76"]
build-backend = "setuptools.build_meta"

[project]
name = "fasta-qc"
version = "0.1.0"
description = "A tested command-line tool for DNA sequence validation and FASTA quality control"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Sohail Shaik"}]
requires-python = ">=3.10"
dependencies = []

[project.urls]
Repository = "https://github.com/sohailshaik03/fasta-qc"

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[tool.setuptools]
py-modules = ["dna_analysis", "fasta_parser", "fasta_analysis", "fasta_cli"]
package-dir = {"" = "src"}

[project.scripts]
fasta-qc = "fasta_cli:main"
